<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 16.8 408 190.4" role="img" aria-labelledby="title">
  <title id="title">UBC Medicine — Drone Transport Initiative unofficial retro concept</title>
  <style>text{font-family:Arial,sans-serif}.label{font:700 15px monospace;letter-spacing:1px}</style>
  <defs>
    <pattern id="crt-stripes" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="6" fill="white"/>
      <path d="M0 5h4" stroke="#a3a3a3" stroke-width="2"/>
    </pattern>
    <mask id="crt-artwork" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="224">
      <rect width="480" height="224" fill="url(#crt-stripes)"/>
